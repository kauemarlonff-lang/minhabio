<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metificha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
            /* Camada escura forte por cima da foto para destacar o vidro */
            background: linear-gradient(rgba(5, 5, 8, 0.85), rgba(5, 5, 8, 0.85)), url('fundo.png') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .profile-card {
            width: 100%;
            background: rgba(18, 18, 24, 0.55); /* Vidro escuro translúcido */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        .banner {
            width: 100%;
            height: 130px;
            background-color: #101015;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            margin-top: -48px;
            margin-bottom: 12px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .bio {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
        }

        .link-button {
            width: 100%;
            background: rgba(18, 18, 24, 0.55); /* Vidro escuro translúcido nos botões */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 22px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .link-button:hover {
            background: rgba(30, 30, 42, 0.75);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 20px;
            width: 26px;
            text-align: center;
        }

        .link-text {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-button:hover .link-arrow {
            transform: translateX(4px);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="banner">
                <img src="banner.png" alt="Banner">
            </div>
            <img src="avatar.png" class="avatar" alt="Avatar">
            <div class="name">Metificha</div>
            <div class="bio">parafusometificha | te amo</div>
        </div>

        <a href="https://tiktok.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-tiktok link-icon"></i>
                <span class="link-text">TikTok Principal</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://instagram.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-instagram link-icon" style="color: #E1306C;"></i>
                <span class="link-text">Instagram</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://youtube.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-youtube link-icon" style="color: #FF0000;"></i>
                <span class="link-text">Canal do YouTube</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://whatsapp.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-whatsapp link-icon" style="color: #25D366;"></i>
                <span class="link-text">Contato Direto</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>
    </div>

</body>
</html>
