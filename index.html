<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metificha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body, html {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Poppins', sans-serif; color: white;
            background-color: #000;
        }

        /* Vídeo de fundo */
        #video-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -999;
            filter: brightness(0.4);
        }

        .container {
            width: 100%; max-width: 400px; margin: 0 auto; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
        }

        .profile-card {
            width: 100%; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px); border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; align-items: center; padding-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .banner { width: 100%; height: 120px; border-radius: 24px 24px 0 0; overflow: hidden; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }

        .avatar {
            width: 90px; height: 90px; border-radius: 50%;
            margin-top: -45px; border: 4px solid #000;
        }

        .name { font-size: 1.5rem; font-weight: 700; margin-top: 10px; }
        .bio { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-bottom: 10px; }

        .link-button {
            width: 100%; background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px; border-radius: 16px; display: flex; align-items: center;
            justify-content: space-between; text-decoration: none; color: white;
            transition: 0.3s;
        }
        .link-button:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }
    </style>
</head>
<body>

    <video id="video-background" autoplay muted loop playsinline>
        <source src="fundo.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="profile-card">
            <div class="banner"><img src="banner.png" alt="Banner"></div>
            <img src="avatar.png" class="avatar" alt="Avatar">
            <div class="name">Metificha</div>
            <div class="bio">parafusometificha | te amo</div>
        </div>

        <a href="URL_DO_SEU_TIKTOK" target="_blank" class="link-button">
            <span><i class="fa-brands fa-tiktok"></i> TikTok</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="URL_DO_SEU_DISCORD" target="_blank" class="link-button">
            <span><i class="fa-brands fa-discord"></i> Discord</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="URL_DO_SEU_SPOTIFY" target="_blank" class="link-button">
            <span><i class="fa-brands fa-spotify"></i> Spotify</span>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
    </div>

</body>
</html>
