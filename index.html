<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metificha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            background: #09090e;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .profile-card {
            width: 100%;
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .banner {
            width: 100%;
            height: 130px;
            background-color: #121218;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            margin-top: -48px;
            margin-bottom: 12px;
            background: #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .bio {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 0 20px;
        }

        .link-button {
            width: 100%;
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 22px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .link-button:hover {
            background: rgba(30, 30, 44, 0.85);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 20px;
            width: 26px;
            text-align: center;
        }

        .link-text {
            font-weight: 600;
            font-size: 14px;
        }

        .link-arrow {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease;
        }

        .link-button:hover .link-arrow {
            transform: translateX(4px);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="banner">
                <img src="banner.png" alt="Banner">
            </div>
            <img src="avatar.png" class="avatar" alt="Avatar">
            <div class="name">Metificha</div>
            <div class="bio">parafusometificha | te amo</div>
        </div>

        <a href="https://tiktok.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-tiktok link-icon"></i>
                <span class="link-text">TikTok Principal</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://discord.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-discord link-icon" style="color: #5865F2;"></i>
                <span class="link-text">Discord</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://spotify.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-spotify link-icon" style="color: #1DB954;"></i>
                <span class="link-text">Spotify</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>
    </div>

</body>
</html>
