<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metificha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
            background-color: #0b0b0e;
        }

        /* Tela de Entrada para destravar o som e o vídeo */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 14, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #enter-screen h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 0;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            gap: 15px;
            box-sizing: border-box;
        }

        .profile-card, .whatsapp-box, .music-player {
            width: 100%;
            max-width: 450px;
            background-color: rgba(20, 20, 23, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        /* Profile */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 25px;
            overflow: hidden;
        }

        .profile-banner {
            width: 100%;
            height: 140px;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .profile-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            margin-top: -55px;
            margin-bottom: 12px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .profile-description {
            font-size: 14px;
            opacity: 0.9;
            text-align: center;
            padding: 0 20px;
        }

        /* WhatsApp box */
        .whatsapp-box {
            padding: 15px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .whatsapp-box:hover {
            background-color: rgba(30, 30, 35, 0.8);
            transform: translateY(-2px);
        }

        .whatsapp-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .whatsapp-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        .whatsapp-info-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .whatsapp-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .whatsapp-name {
            font-weight: bold;
            font-size: 16px;
        }

        .whatsapp-icon {
            font-size: 20px;
            color: #25D366;
        }

        .whatsapp-status {
            display: flex;
            align-items: center;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-online { background: #3ba55c; }
        .status-idle { background: #faa61a; }
        .status-dnd { background: #ed4245; }
        .status-offline { background: #747f8d; }

        .discord-activity {
            font-size: 13px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: none;
        }

        .activity-image {
            margin-top: 8px;
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            display: none;
        }

        /* Music player */
        .music-player {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .song-cover {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        .song-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .song-title {
            font-size: 14px;
            font-weight: bold;
        }

        .song-artist {
            font-size: 12px;
            opacity: 0.8;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            margin: 4px 0;
        }

        .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 4px;
            width: 0%;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            opacity: 0.7;
        }

        .play-pause {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    </style>
</head>
<body>
    <!-- Tela que destrava o som e o vídeo ao clicar -->
    <div id="enter-screen">
        <h2>[ CLIQUE PARA ENTRAR ]</h2>
    </div>

    <!-- O vídeo de fundo puxando direto da sua pasta (background.mp4) -->
    <video id="video-background" autoplay muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>

    <audio id="music-player" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Profile -->
        <div class="profile-card">
            <div class="profile-banner">
                <img src="banner.png" alt="Banner">
            </div>
            <img src="avatar.png" class="profile-pic" alt="Avatar">
            <div class="profile-name">Metificha</div>
            <div class="profile-description">
                parafusometificha | te amo
            </div>
        </div>

        <!-- Caixa com ícone do WhatsApp. Mude o link 'https://wa.me/SEUNUMERO' para o que preferir, ou deixe assim -->
        <a href="https://wa.me/" target="_blank" class="whatsapp-box" id="discord-profile">
            <div class="whatsapp-header">
                <img id="discord-avatar" class="whatsapp-pic" src="avatar.png" alt="Avatar">
                <div class="whatsapp-info-container">
                    <div class="whatsapp-name-row">
                        <div class="whatsapp-name" id="discord-username">Metificha</div>
                        <i class="fa-brands fa-whatsapp whatsapp-icon"></i>
                    </div>
                    <div class="whatsapp-status">
                        <div class="status-indicator" id="status-indicator"></div>
                        <span id="discord-status-text">Online</span>
                    </div>
                </div>
            </div>
            <div class="discord-activity" id="activity-section">
                <div style="font-weight: bold; margin-bottom: 3px;">Activity:</div>
                <div id="discord-activity-name">-</div>
                <img id="activity-image" class="activity-image" src="" alt="">
            </div>
            <div class="discord-activity" id="spotify-section">
                <div style="font-weight: bold; margin-bottom: 3px;">Spotify:</div>
                <div id="discord-spotify-info">-</div>
                <img id="spotify-image" class="activity-image" src="" alt="">
            </div>
        </a>

        <!-- Music Player -->
        <div class="music-player">
            <img src="album-cover.jpg" class="song-cover" alt="Cover">
            <div class="song-info">
                <div class="song-title">na rk do kaue do odio</div>
                <div class="song-artist">mete rebolando cu de Beyblade</div>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            <button class="play-pause" id="play-button">▶</button>
        </div>
    </div>

    <script>
        const enterScreen = document.getElementById('enter-screen');
        const audioPlayer = document.getElementById('music-player');
        const videoBackground = document.getElementById('video-background');
        const playButton = document.getElementById('play-button');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeElement = document.getElementById('current-time');
        const durationElement = document.getElementById('duration');

        audioPlayer.volume = 0.5;

        // Ao clicar na tela inicial, some com ela, toca a música e força o vídeo local
        enterScreen.addEventListener('click', () => {
            enterScreen.style.opacity = '0';
            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 500);

            audioPlayer.play().then(() => {
                playButton.textContent = '⏸';
            }).catch(e => console.log("Erro ao tocar áudio:", e));

            videoBackground.play().catch(e => console.log("Erro ao tocar vídeo:", e));
        });

        playButton.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playButton.textContent = '⏸';
            } else {
                audioPlayer.pause();
                playButton.textContent = '▶';
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const { currentTime, duration } = audioPlayer;
            if (duration) {
                progressBar.style.width = `${(currentTime / duration) * 100}%`;
                currentTimeElement.textContent = formatTime(currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationElement.textContent = formatTime(audioPlayer.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            audioPlayer.currentTime = (e.offsetX / width) * audioPlayer.duration;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        const userId = "1284897089163014154";

        async function fetchDiscordStatus() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const data = await res.json();
                if (!data.success) return;

                const d = data.data;
                document.getElementById("discord-avatar").src = `https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png?size=128`;
                document.getElementById("discord-username").textContent = d.discord_user.username;

                const statusText = { online: "Online", idle: "Idle", dnd: "Do Not Disturb", offline: "Offline" };
                document.getElementById("discord-status-text").textContent = statusText[d.discord_status] || d.discord_status;
                
                const indicator = document.getElementById("status-indicator");
                indicator.className = `status-indicator status-${d.discord_status}`;

                document.getElementById("activity-section").style.display = "none";
                document.getElementById("spotify-section").style.display = "none";

                const game = d.activities.find(a => a.type === 0);
                if (game) {
                    document.getElementById("activity-section").style.display = "block";
                    document.getElementById("discord-activity-name").textContent = game.name;
                    if (game.assets?.large_image) {
                        let imgKey = game.assets.large_image;
                        let imgUrl = imgKey.startsWith("mp:external") ? imgKey.replace(/^mp:/, "https:") : `https://cdn.discordapp.com/app-assets/${game.application_id}/${imgKey}.png`;
                        const actImg = document.getElementById("activity-image");
                        actImg.src = imgUrl;
                        actImg.style.display = "block";
                    }
                }

                if (d.listening_to_spotify && d.spotify) {
                    document.getElementById("spotify-section").style.display = "block";
                    document.getElementById("discord-spotify-info").textContent = `${d.spotify.song} - ${d.spotify.artist}`;
                    const spotImg = document.getElementById("spotify-image");
                    spotImg.src = d.spotify.album_art_url;
                    spotImg.style.display = "block";
                }
            } catch (err) {
                console.error(err);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 15000);
    </script>
</body>
</html>
