<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayla Oliveira</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
            background-color: #070709;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Vídeo de fundo fixo com tom cinematográfico escuro */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -999;
            filter: brightness(0.4);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-sizing: border-box;
            z-index: 1;
        }

        /* Cartão de Perfil Principal */
        .profile-card {
            width: 100%;
            background: rgba(14, 14, 18, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .profile-banner {
            width: 100%;
            height: 130px;
            background-color: #121217;
        }

        .profile-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            margin-top: -50px;
            margin-bottom: 10px;
            background: #000;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .profile-handle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
        }

        .profile-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
        }

        /* Botões de Link (Estilo Pílula / Bloco Dark) */
        .link-button {
            width: 100%;
            background: rgba(18, 18, 23, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            box-sizing: border-box;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .link-button:hover {
            background: rgba(30, 30, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: #fff;
        }

        .link-text {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .link-arrow {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease;
        }

        .link-button:hover .link-arrow {
            transform: translateX(3px);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Vídeo de fundo escuro e minimalista -->
    <video id="video-background" autoplay muted loop playsinline>
        <source src="esser.ai" type="video/mp4">
    </video>

    <div class="container">
        <!-- Bloco de Perfil -->
        <div class="profile-card">
            <div class="profile-banner">
                <img src="banner.png" alt="Banner">
            </div>
            <img src="avatar.png" class="profile-pic" alt="Avatar">
            <div class="profile-name">Ayla Oliveira</div>
            <div class="profile-handle">@aylac_z</div>
            <div class="profile-description">
                criadora de conteúdo & digital | focado no corre
            </div>
        </div>

        <!-- Botões de Links (Personalize os links e ícones conforme necessário) -->
        <a href="https://tiktok.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-tiktok link-icon"></i>
                <span class="link-text">TikTok Principal</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://instagram.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-instagram link-icon"></i>
                <span class="link-text">Instagram / Perfis</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://youtube.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-youtube link-icon" style="color: #ff0000;"></i>
                <span class="link-text">Canal do YouTube</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>

        <a href="https://whatsapp.com" target="_blank" class="link-button">
            <div class="link-content">
                <i class="fa-brands fa-whatsapp link-icon" style="color: #25D366;"></i>
                <span class="link-text">Contato Direto</span>
            </div>
            <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>
    </div>

</body>
</html>
