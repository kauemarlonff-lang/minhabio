<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metificha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: white;
            background-color: #0b0b0e;
            overflow-x: hidden;
        }

        /* Tela de Entrada para destravar o som e o vídeo */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 14, 0.95);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #enter-screen h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 0;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Vídeo de fundo fixo */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -999;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            gap: 15px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        /* Padrão dos Cards */
        .profile-card, .discord-box, .music-player {
            width: 100%;
            max-width: 420px;
            background-color: rgba(18, 18, 22, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Profile Card */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 22px;
            overflow: hidden;
        }

        .profile-banner {
            width: 100%;
            height: 130px;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .profile-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            margin-top: -48px;
            margin-bottom: 10px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Ícones Sociais (como na referência) */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .social-icons a {
            color: white;
            font-size: 18px;
            opacity: 0.85;
            transition: opacity 0.2s, transform 0.2s;
            text-decoration: none;
        }

        .social-icons a:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .profile-description {
            font-size: 13px;
            opacity: 0.8;
            text-align: center;
            padding: 0 20px;
        }

        /* Bloco do Discord */
        .discord-box {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .discord-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            object-fit: cover;
        }

        .discord-info-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .discord-name {
            font-weight: 600;
            font-size: 15px;
        }

        .discord-status {
            display: flex;
            align-items: center;
            font-size: 12px;
            opacity: 0.75;
            margin-top: 2px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-online { background: #3ba55c; }
        .status-idle { background: #faa61a; }
        .status-dnd { background: #ed4245; }
        .status-offline { background: #747f8d; }

        /* Music player */
        .music-player {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .song-cover {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
        }

        .song-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .song-title {
            font-size: 13px;
            font-weight: 600;
        }

        .song-artist {
            font-size: 11px;
            opacity: 0.75;
        }

        .progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            margin: 4px 0;
        }

        .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 3px;
            width: 0%;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            opacity: 0.6;
        }

        .play-pause {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .play-pause:hover {
            opacity: 1;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    </style>
</head>
<body>
    <!-- Tela que destrava o som e o vídeo ao clicar -->
    <div id="enter-screen">
        <h2>[ CLIQUE PARA ENTRAR ]</h2>
    </div>

    <!-- Vídeo de fundo -->
    <video id="video-background" autoplay muted loop playsinline>
        <source src="esser.ai" type="video/mp4">
    </video>

    <audio id="music-player" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-banner">
                <img src="banner.png" alt="Banner">
            </div>
            <img src="avatar.png" class="profile-pic" alt="Avatar">
            <div class="profile-name">Metificha</div>
            
            <!-- Ícones Sociais iguais ao modelo -->
            <div class="social-icons">
                <a href="https://youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://discord.com" target="_blank"><i class="fa-brands fa-discord"></i></a>
                <a href="https://twitter.com" target="_blank"><i class="fa-brands fa-twitter"></i></a>
            </div>

            <div class="profile-description">
                parafusometificha | te amo
            </div>
        </div>

        <!-- Bloco do Discord (Status) -->
        <div class="discord-box">
            <img id="discord-avatar" class="discord-pic" src="avatar.png" alt="Avatar">
            <div class="discord-info-container">
                <div class="discord-name" id="discord-username">Metificha</div>
                <div class="discord-status">
                    <div class="status-indicator" id="status-indicator"></div>
                    <span id="discord-status-text">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Music Player -->
        <div class="music-player">
            <img src="album-cover.jpg" class="song-cover" alt="Cover">
            <div class="song-info">
                <div class="song-title">na rk do kaue do odio</div>
                <div class="song-artist">mete rebolando cu de Beyblade</div>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            <button class="play-pause" id="play-button">▶</button>
        </div>
    </div>

    <script>
        const enterScreen = document.getElementById('enter-screen');
        const audioPlayer = document.getElementById('music-player');
        const videoBackground = document.getElementById('video-background');
        const playButton = document.getElementById('play-button');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeElement = document.getElementById('current-time');
        const durationElement = document.getElementById('duration');

        audioPlayer.volume = 0.5;

        videoBackground.load();
        videoBackground.play().catch(() => {});

        enterScreen.addEventListener('click', () => {
            enterScreen.style.opacity = '0';
            setTimeout(() => {
                enterScreen.style.display = 'none';
            }, 500);

            audioPlayer.play().then(() => {
                playButton.textContent = '⏸';
            }).catch(e => console.log("Erro ao tocar áudio:", e));

            videoBackground.play().catch(e => console.log("Erro ao tocar vídeo:", e));
        });

        playButton.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playButton.textContent = '⏸';
            } else {
                audioPlayer.pause();
                playButton.textContent = '▶';
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const { currentTime, duration } = audioPlayer;
            if (duration) {
                progressBar.style.width = `${(currentTime / duration) * 100}%`;
                currentTimeElement.textContent = formatTime(currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationElement.textContent = formatTime(audioPlayer.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            audioPlayer.currentTime = (e.offsetX / width) * audioPlayer.duration;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        const userId = "1284897089163014154";

        async function fetchDiscordStatus() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const data = await res.json();
                if (!data.success) return;

                const d = data.data;
                document.getElementById("discord-avatar").src = `https://cdn.discordapp.com/avatars/${d.discord_user.id}/${d.discord_user.avatar}.png?size=128`;
                document.getElementById("discord-username").textContent = d.discord_user.username;

                const statusText = { online: "Online", idle: "Idle", dnd: "Do Not Disturb", offline: "Offline" };
                document.getElementById("discord-status-text").textContent = statusText[d.discord_status] || d.discord_status;
                
                const indicator = document.getElementById("status-indicator");
                indicator.className = `status-indicator status-${d.discord_status}`;
            } catch (err) {
                console.error(err);
            }
        }

        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 15000);
    </script>
</body>
</html>
